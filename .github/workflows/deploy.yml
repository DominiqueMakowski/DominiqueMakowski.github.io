on:
    push:
        branches:
            - master

name: 🚀 Deploy

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Write redirect pages for the old website's URLs
              run: python3 .github/redirect_pages.py

            - name: Deploy 🚀
              uses: peaceiris/actions-gh-pages@v4
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: ./
                  exclude_assets: ".github,.gitignore,README.md,drafts"
